# Reference copy of the CI/CD pipeline used for the live demo.
# It lives under docs/ so it does not run in this repository.
# To use it: copy it to .github/workflows/, create an Azure Web App, set up
# OpenID Connect (federated credentials) and add the three AZURE_* secrets.

name: Build and deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install server dependencies
        run: npm install --omit=dev

      - name: Build frontend
        run: npm run build

      - name: Remove files not needed at runtime
        run: rm -rf frontend/node_modules frontend/src frontend/public docs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # required for OpenID Connect login
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'your-app-name'
          package: .
